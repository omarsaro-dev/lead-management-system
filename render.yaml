services:
  - type: web
    name: lead-management-api
    runtime: python
    plan: free
    buildCommand: pip install -r Backend/requirements.txt
    startCommand: uvicorn Backend.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
